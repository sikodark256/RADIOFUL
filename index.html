<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="apple-icon.png">
<link rel="apple-touch-icon" href="apple-icon.png">
<title>sikodark radio</title>

<!-- ===== 📊 Librerías de Firebase ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

<style>
:root{color-scheme:dark;--bg:#171820;--card:#22232b;--secondary:#2c2d35;--text:#f5f5f7;--muted:#a5a6ad;--primary:#ff8a24;--border:rgba(255,255,255,.1);--success:#34c759;--error:#ff3b30;--warning:#ffcc00;--info:#0a84ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 16px}
.wrap{width:100%;max-width:448px}.card{border:1px solid var(--border);background:var(--card);border-radius:28px;padding:24px;box-shadow:0 20px 55px rgba(0,0,0,.35)}
@media(min-width:640px){.card{padding:32px}}
.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover}.eyebrow,.mono{font-family:monospace}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}.brand-name{font-size:14px;font-weight:700;margin-top:2px}
.status{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 11px;font:11px monospace;text-transform:uppercase;letter-spacing:.08em;background:var(--secondary);color:var(--muted)}.status.live{background:rgba(255,138,36,.14);color:var(--primary)}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.live .dot{background:var(--primary);animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35}}
.cover{position:relative;margin-top:24px;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--secondary)}.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.eq{position:absolute;left:0;right:0;bottom:0;height:34%;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:32px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent)}.bar{width:10px;height:12px;border-radius:8px;background:var(--primary);opacity:.4}.playing .bar{opacity:1;animation:bounce .8s ease-in-out infinite alternate}.playing .bar:nth-child(2){animation-delay:.09s}.playing .bar:nth-child(3){animation-delay:.18s}.playing .bar:nth-child(4){animation-delay:.27s}.playing .bar:nth-child(5){animation-delay:.36s}.playing .bar:nth-child(6){animation-delay:.45s}.playing .bar:nth-child(7){animation-delay:.54s}.playing .bar:nth-child(8){animation-delay:.63s}.playing .bar:nth-child(9){animation-delay:.72s}@keyframes bounce{to{height:75%}}
.now{margin-top:24px;min-height:64px;text-align:center}.now .eyebrow{margin-bottom:5px}.title{margin:0;font-size:19px;font-weight:800;line-height:1.2}.artist{margin:5px 0 0;color:var(--muted);font-size:14px}
.controls{margin-top:24px;display:flex;align-items:center;gap:16px}.play{width:64px;height:64px;flex:0 0 64px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#191919;cursor:pointer;box-shadow:0 8px 25px rgba(255,138,36,.2);transition:transform .15s}.play:hover{transform:scale(1.05)}.play svg{width:28px;height:28px;fill:currentColor}.volume{display:flex;align-items:center;gap:12px;flex:1}.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:3px;display:grid;place-items:center}.icon-btn:hover{color:var(--text)}input[type=range]{width:100%;accent-color:var(--primary)}
.install{margin-top:24px;width:100%;padding:12px;border:1px solid var(--border);border-radius:999px;background:var(--secondary);color:var(--text);font-weight:700;cursor:pointer}.install:hover{background:#34353d}
.btn-reset{margin-top:10px;width:100%;padding:10px;border:1px dashed var(--border);border-radius:12px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:monospace}
.btn-reset:hover{color:var(--error);border-color:var(--error)}
.history{margin-top:24px}.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.history h2{font-size:18px;margin:0;font-weight:800}.history p.sub{font-size:11px;color:var(--muted);margin:5px 0 0}.count{padding:6px 11px;border-radius:999px;background:var(--secondary);color:var(--muted);font:11px monospace;white-space:nowrap}.history-grid{margin-top:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.empty{grid-column:1/-1;border:1px dashed var(--border);border-radius:16px;padding:32px 16px;text-align:center;color:var(--muted);font-size:13px}.track{overflow:hidden;border-radius:12px;background:var(--secondary)}.track-art{position:relative;aspect-ratio:1}.track-art img{width:100%;height:100%;object-fit:cover;display:block}.rank{position:absolute;left:8px;top:8px;border-radius:999px;background:rgba(23,24,32,.92);padding:4px 7px;font:11px monospace;font-weight:700}.track-info{padding:10px}.track-title,.track-artist{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-title{font-size:13px;font-weight:700}.track-artist{font-size:11px;color:var(--muted);margin-top:3px}footer{color:var(--muted);text-align:center;font:11px monospace}
.hidden{display:none}

/* ===== ❤️ BOTÓN ME GUSTA ===== */
.like-row{text-align:center;margin-top:14px}
.like-btn{border:1px solid var(--border);background:var(--secondary);border-radius:999px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .2s}
.like-btn:active{transform:scale(.94)}
.like-btn.liked{color:var(--error);border-color:rgba(255,59,48,.5);background:rgba(255,59,48,.12)}

/* ===== PANEL DE DIAGNÓSTICO ===== */
#diagnostico{
  margin-top:16px;padding:12px 14px;border-radius:14px;
  background:var(--secondary);border:1px solid var(--border);
  font-family:monospace;font-size:11px;line-height:1.6;
}
.diag-line{display:flex;align-items:flex-start;gap:6px;margin-top:2px}
.diag-line .prefix{color:var(--primary);flex:0 0 auto;font-weight:700}
.diag-line .msg{color:var(--text);word-break:break-word}
.diag-line.ok .msg{color:var(--success)}
.diag-line.err .msg{color:var(--error)}
.diag-line.info .msg{color:var(--info)}
.diag-line.warn .msg{color:var(--warning)}

/* ===== FONDO DINÁMICO ===== */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:var(--bg);background-size:cover;background-position:center;
  transition:background-image .8s ease,filter .8s ease;
  filter:blur(40px) brightness(.35) saturate(1.2);
  transform:scale(1.1);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(135deg,rgba(23,24,32,.85),rgba(23,24,32,.6));
  pointer-events:none;
}
/* ===== NOTIFICACIÓN INTELIGENTE ===== */
#smartNotify{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:9999;max-width:460px;width:calc(100% - 32px);
  background:linear-gradient(135deg,rgba(34,35,43,.95),rgba(44,45,53,.92));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:16px;
  padding:14px 18px 14px 14px;
  box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,138,36,.08);
  display:flex;gap:12px;align-items:flex-start;
  opacity:0;pointer-events:none;
  transition:opacity .4s ease,transform .4s ease;
}
#smartNotify.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#smartNotify .notify-art{width:52px;height:52px;flex:0 0 52px;border-radius:10px;overflow:hidden;background:var(--secondary)}
#smartNotify .notify-art img{width:100%;height:100%;object-fit:cover;display:block}
#smartNotify .notify-body{flex:1;min-width:0}
#smartNotify .notify-tag{font:10px monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--primary);margin-bottom:4px}
#smartNotify .notify-phrase{font-size:13px;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
#smartNotify .notify-close{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px;font-size:16px;line-height:1;flex:0 0 auto}
#smartNotify .notify-close:hover{color:var(--text)}
</style>
</head>
<body>
<main>
<div class="wrap">
<section class="card" aria-label="Reproductor de radio">
<audio id="audio" preload="none"></audio>
<div class="top">
  <div class="brand"><img id="brandLogo" src="apple-icon.png" alt="sikodark"><div><div class="eyebrow">Radio online</div><div class="brand-name">sikodark</div></div></div>
  <div id="status" class="status"><span class="dot"></span><span id="statusText">Detenido</span></div>
</div>
<div id="coverBox" class="cover">
  <img id="cover" src="apple-icon.png" alt="Logo de sikodark">
  <div id="eq" class="eq"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
</div>
<div class="now"><div class="eyebrow">Sonando ahora</div><p id="title" class="title">Conectando…</p><p id="artist" class="artist"></p></div>

<!-- ===== ❤️ BOTÓN ME GUSTA ===== -->
<div class="like-row"><button id="btnLike" class="like-btn" aria-label="Me gusta este tema">🤍 <span>Me gusta</span></button></div>

<!-- ===== PANEL DE DIAGNÓSTICO ===== -->
<div id="diagnostico">
  <div class="diag-line info"><span class="prefix">→</span><span class="msg">Iniciando sikodark v6...</span></div>
</div>

<div class="controls">
  <button id="play" class="play" aria-label="Reproducir"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg></button>
  <div class="volume">
    <button id="mute" class="icon-btn" aria-label="Silenciar"><svg id="volIcon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M19 9a5 5 0 0 1 0 6"/><path d="M16.5 7.5a8 8 0 0 1 0 9"/></svg></button>
    <input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volumen">
  </div>
</div>
<button id="install" class="install hidden">⇩ &nbsp; Instalar app</button>
<button id="btnReset" class="btn-reset">🧹 Limpiar caché y recargar</button>
</section>

<section class="card history" aria-labelledby="history-title">
<div class="history-head"><div><h2 id="history-title">◉ &nbsp;Reproducidos recientemente</h2><p class="sub">Últimas canciones reproducidas</p></div><span id="count" class="count">0/10 temas</span></div>
<div id="history" class="history-grid"><p class="empty">Las canciones aparecerán aquí cuando empieces a escuchar la radio.</p></div>
</section>
</div>
<footer>sikodark radio · música en directo</footer>

<div id="smartNotify" role="alert" aria-live="polite">
  <div class="notify-art"><img id="notifyArt" src="apple-icon.png" alt=""></div>
  <div class="notify-body">
    <div class="notify-tag" id="notifyTag">Información del artista</div>
    <div class="notify-phrase" id="notifyPhrase">Cargando…</div>
  </div>
  <button class="notify-close" id="notifyClose" aria-label="Cerrar notificación">×</button>
</div>
</main>

<script>
/* =========================================================
   CONFIGURACIÓN v6
   ========================================================= */
const STREAM_URL = "https://stream.zeno.fm/xdkqr4btptutv";
const MOUNT_ID = "xdkqr4btptutv";
const LOGO = "apple-icon.png";
const MAX_HISTORY = 10;

const ZENO_SSE_URL = `https://api.zeno.fm/mounts/metadata/subscribe/${MOUNT_ID}`;
const ZENO_REST_URL = `https://api.zeno.fm/mounts/${MOUNT_ID}`;

const ITUNES_URL = "https://itunes.apple.com/search";
const DEEZER_URL = "https://api.deezer.com/search";
const DEEZER_ALBUM_URL = "https://api.deezer.com/search/album";
const LASTFM_URL = "https://ws.audioscrobbler.com/2.0/";
const LASTFM_KEY = "8a2156a5c0c1194f8b8e96d22f0a0a9b";

const AUDIODB_URL = "https://www.theaudiodb.com/api/v1/json/123/search.php?s=";
const WIKIPEDIA_SEARCH_URL = "https://es.wikipedia.org/w/api.php";
const WIKIPEDIA_SUMMARY_URL = "https://es.wikipedia.org/api/rest_v1/page/summary/";

const PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  (url) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`
];

let imagenArtistaGlobal = null;

/* =========================================================
   ELEMENTOS DOM
   ========================================================= */
const audio=document.getElementById("audio"), play=document.getElementById("play"), titleEl=document.getElementById("title");
const artistEl=document.getElementById("artist"), coverEl=document.getElementById("cover"), status=document.getElementById("status");
const statusText=document.getElementById("statusText"), volume=document.getElementById("volume"), mute=document.getElementById("mute");
const historyEl=document.getElementById("history"), countEl=document.getElementById("count"), install=document.getElementById("install"), eq=document.getElementById("eq");
const diagnostico=document.getElementById("diagnostico"), btnReset=document.getElementById("btnReset");

let isPlaying=false,isLoading=false,muted=false,cover=null,history=[];
let ultimoTitulo = "", pollingInterval = null;
audio.volume=.8;

// Cargar historial desde localStorage
try {
  const h = localStorage.getItem("sikodark-history");
  if (h) history = JSON.parse(h);
} catch(e) { history = []; }

/* =========================================================
   FUNCIONES DE DEBUG VISIBLES
   ========================================================= */
function log(tipo, mensaje) {
  const iconos = { ok: "✅", err: "❌", info: "ℹ️", warn: "⚠️" };
  const linea = document.createElement("div");
  linea.className = `diag-line ${tipo}`;
  linea.innerHTML = `<span class="prefix">${iconos[tipo]||"→"}</span><span class="msg">${mensaje}</span>`;
  diagnostico.appendChild(linea);
  // Mantener solo las últimas 15 líneas
  while (diagnostico.children.length > 15) diagnostico.removeChild(diagnostico.firstChild);
  console.log(`[${tipo}] ${mensaje}`);
}

/* =========================================================
   FUNCIONES BÁSICAS
   ========================================================= */
function setPlaying(v){isPlaying=v;status.classList.toggle("live",v);statusText.textContent=v?"En vivo":"Detenido";eq.classList.toggle("playing",v);play.innerHTML=isLoading?spinner():v?pauseIcon():playIcon();play.setAttribute("aria-label",v?"Pausar":"Reproducir")}
function spinner(){return '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8" opacity=".25"/><path d="M20 12a8 8 0 0 1-8 8"/></svg>'}
function playIcon(){return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}
function pauseIcon(){return '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'}

async function startPlayback(){
  try{
    isLoading=true; play.innerHTML=spinner();
    if(!audio.src) audio.src=STREAM_URL;
    await audio.play();
    log("ok", "Audio reproduciéndose");
  }catch(e){isLoading=false;setPlaying(false);log("err","No se pudo reproducir: "+e.message)}
}
// 📊 Registra el fin de escucha al detener
function stopPlayback(){registrarFinEscucha();audio.pause();setPlaying(false);isLoading=false}

play.onclick=()=>isPlaying?stopPlayback():startPlayback();
audio.onplaying=()=>{isLoading=false;setPlaying(true)};
audio.onwaiting=()=>{isLoading=true;play.innerHTML=spinner()};
// 📊 Registra el fin de escucha al pausar
audio.onpause=()=>{registrarFinEscucha();if(!audio.ended){isLoading=false;setPlaying(false)}};
audio.onerror=()=>{isLoading=false;setPlaying(false);log("err","Error en el stream de audio")};

volume.oninput=()=>{audio.volume=Number(volume.value);muted=false;audio.muted=false};
mute.onclick=()=>{muted=!muted;audio.muted=muted;mute.innerHTML=muted?'<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>':'<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M19 9a5 5 0 0 1 0 6"/><path d="M16.5 7.5a8 8 0 0 1 0 9"/></svg>'};

// Botón reset
btnReset.onclick = () => {
  localStorage.removeItem("sikodark-history");
  localStorage.removeItem("sikodark-smart-cache");
  history = [];
  renderHistory();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      Promise.all(regs.map(r => r.unregister())).then(() => window.location.reload(true));
    });
  } else {
    window.location.reload(true);
  }
};

function parseTitle(raw){raw=(raw||"").trim();if(!raw)return{title:"En vivo",artist:null};let i=raw.indexOf(" - ");return i>0?{artist:raw.slice(0,i).trim(),title:raw.slice(i+3).trim()}:{title:raw,artist:null}}

/* =========================================================
   🎵 MEDIA SESSION API — Carátula en SEGUNDO PLANO / Pantalla bloqueo
   ========================================================= */
function actualizarMediaSession(track, urlCaratula) {
  if (!("mediaSession" in navigator)) {
    log("warn", "Media Session no soportado en este navegador");
    return;
  }
  
  try {
    const artwork = [];
    if (urlCaratula && urlCaratula !== LOGO) {
      artwork.push({ src: urlCaratula, sizes: "512x512", type: "image/png" });
      artwork.push({ src: urlCaratula, sizes: "96x96", type: "image/png" });
    } else {
      artwork.push({ src: LOGO, sizes: "512x512", type: "image/png" });
    }
    
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title || "sikodark radio",
      artist: track.artist || "En vivo",
      album: "sikodark radio",
      artwork: artwork
    });
    
    log("ok", `MediaSession actualizado: ${track.artist||""} - ${track.title}`);
    
    // Controles en la pantalla de bloqueo
    navigator.mediaSession.setActionHandler("play", () => startPlayback());
    navigator.mediaSession.setActionHandler("pause", () => stopPlayback());
    
  } catch(e) {
    log("err", "MediaSession error: " + e.message);
  }
}

/* =========================================================
   SET TRACK — La función CENTRAL
   ========================================================= */
function setTrack(t){
  if (!t || !t.title) return;
  
  const trackKey = `${t.artist||""}||${t.title}`;
  if (trackKey === ultimoTitulo && t.title !== "En vivo") {
    log("info", `Misma canción: ${t.title} — ignorando`);
    return;
  }
  ultimoTitulo = trackKey;
  
  log("ok", `🎵 Nueva canción: ${t.artist || "?"} - ${t.title}`);
  
  titleEl.textContent = t.title || "En vivo";
  artistEl.textContent = t.artist || "";
  imagenArtistaGlobal = null;
  
  // 1. Actualizar Media Session (primero con logo, luego con carátula cuando llegue)
  actualizarMediaSession(t, LOGO);
  
  // 2. Buscar carátula
  fetchCover(t);
  
  // 3. Agregar al historial
  agregarAlHistorial(t);
  
  // ===== 📊 Registrar en Firebase (solo si está escuchando) =====
  if (isPlaying) {
    registrarFinEscucha();
    registrarEscucha(t);
    inicioEscucha = Date.now();
    temaActual = t;
  }
  // =====================================================================
  
  // 4. Disparar notificación inteligente
  setTimeout(() => {
    log("info", "Disparando notificación inteligente...");
    procesarCancionInteligente(t);
  }, 800);
}

/* =========================================================
   HISTORIAL — Versión ROBUSTA
   ========================================================= */
function agregarAlHistorial(track) {
  try {
    if (!track.title || track.title === "En vivo" || track.title === "Conectando…") {
      log("warn", "Historial: título inválido, saltando");
      return;
    }
    
    const item = {
      title: track.title,
      artist: track.artist || null,
      cover: cover || null
    };
    
    log("info", `Historial: intentando agregar "${item.title}"`);
    
    const mismo = (x) => x && x.title === item.title && x.artist === item.artist;
    
    // Si el último elemento es el mismo, solo actualizar carátula
    if (history.length > 0 && mismo(history[0])) {
      if (item.cover && history[0].cover !== item.cover) {
        history[0].cover = item.cover;
        log("info", "Historial: actualizando carátula del último");
      } else {
        log("info", "Historial: ya está en la primera posición");
      }
    } else {
      // Quitar duplicados y agregar al principio
      history = history.filter(x => !mismo(x));
      history.unshift(item);
      history = history.slice(0, MAX_HISTORY);
      log("ok", `Historial: agregado. Total: ${history.length} temas`);
    }
    
    // Guardar en localStorage
    localStorage.setItem("sikodark-history", JSON.stringify(history));
    log("info", "Historial: guardado en localStorage");
    
    renderHistory();
    
  } catch(e) {
    log("err", "Historial ERROR: " + e.message + " — " + e.stack);
  }
}

function renderHistory(){
  try {
    countEl.textContent = history.length + "/10 temas";
    if (!history.length) {
      historyEl.innerHTML = '<p class="empty">Las canciones aparecerán aquí cuando empieces a escuchar la radio.</p>';
      return;
    }
    historyEl.innerHTML = history.map((x,i) => {
      if (!x) return "";

/* =========================================================
   FETCH con PROXY
   ========================================================= */
async function fetchConProxy(url, opciones = {}) {
  try {
    const r = await fetch(url, opciones);
    if (r.ok) return r;
  } catch(e) {}
  
  for (let i = 0; i < PROXIES.length; i++) {
    try {
      const urlProxy = PROXIES[i](url);
      const r = await fetch(urlProxy, opciones);
      if (r.ok) return r;
    } catch(e) { continue; }
  }
  throw new Error("Todos los proxies fallaron");
}

function procesarMetadataRaw(streamTitle) {
  if (!streamTitle) return;
  const track = parseTitle(streamTitle);
  if (track.title && track.title !== "En vivo") {
    setTrack(track);
  }
}

function intentarSSE() {
  return new Promise((resolve, reject) => {
    try {
      log("info", "Intentando SSE directo...");
      const source = new EventSource(ZENO_SSE_URL);
      let recibioAlgo = false;
      
      source.onmessage = e => {
        try {
          const d = JSON.parse(e.data);
          if (d.streamTitle) {
            recibioAlgo = true;
            procesarMetadataRaw(d.streamTitle);
          }
        } catch(_) {}
      };
      
      source.onerror = () => {
        source.close();
        if (recibioAlgo) resolve(true);
        else reject(new Error("SSE bloqueado"));
      };
      
      setTimeout(() => {
        if (!recibioAlgo) { source.close(); reject(new Error("SSE timeout")); }
        else resolve(true);
      }, 5000);
      
    } catch(e) { reject(e); }
  });
}

async function iniciarPolling() {
  log("warn", "SSE falló — activando Polling con proxy CORS");
  
  async function consultar() {
    try {
      const r = await fetchConProxy(ZENO_REST_URL);
      const d = await r.json();
      
      let streamTitle = null;
      if (d.streamTitle) streamTitle = d.streamTitle;
      else if (d.mount && d.mount.streamTitle) streamTitle = d.mount.streamTitle;
      else if (d.now_playing && d.now_playing.song) {
        const np = d.now_playing.song;
        streamTitle = `${np.artist || ""} - ${np.title || ""}`.trim();
      }
      
      if (streamTitle) {
        procesarMetadataRaw(streamTitle);
      }
    } catch(e) {
      log("err", "Polling error: " + e.message);
    }
  }
  
  consultar();
  if (pollingInterval) clearInterval(pollingInterval);
  pollingInterval = setInterval(consultar, 10000);
}

async function conectarMetadata() {
  log("info", "Conectando sistema de metadata...");
  try {
    await intentarSSE();
    log("ok", "SSE conectado correctamente");
    return;
  } catch(e) {
    log("warn", "SSE falló: " + e.message);
  }
  iniciarPolling();
}

const FRASES_RESPALDO = [
  "Una canción para disfrutar en sikodark radio, tu compañero musical diario.",
  "La música que te acompaña en cada momento del día.",

async function buscarEnWikipedia(artista) {
  if (!artista) return null;
  try {
    const nombre = encodeURIComponent(artista.trim());
    const searchUrl = `${WIKIPEDIA_SEARCH_URL}?action=query&list=search&srsearch=${nombre}&format=json&origin=*&srlimit=3`;
    const r = await fetch(searchUrl);
    const d = await r.json();
    
    if (!d.query || !d.query.search || !d.query.search.length) return null;

    let pagina = null;
    const palabrasClave = ["música", "musical", "banda", "grupo", "artista", "cantante", "solista", "rock", "pop", "metal"];
    
    for (const res of d.query.search) {
      const snippet = (res.snippet || "").toLowerCase();
      const titulo = (res.title || "").toLowerCase();
      if (palabrasClave.some(p => snippet.includes(p) || titulo.includes(p))) {
        pagina = res.title;
        break;
      }
    }
    if (!pagina) pagina = d.query.search[0].title;

    const paginaEncoded = encodeURIComponent(pagina.replace(/ /g, "_"));
    const summaryUrl = `${WIKIPEDIA_SUMMARY_URL}${paginaEncoded}`;
    const r2 = await fetch(summaryUrl);
    if (!r2.ok) return null;
    const d2 = await r2.json();
    if (!d2.extract) return null;

    let extracto = d2.extract.trim();
    let frase = "", oraciones = 0, posicion = 0, maxCaracteres = 320;
    
    while (oraciones < 3 && posicion < extracto.length && posicion < maxCaracteres) {
      const punto = extracto.substring(posicion).search(/[.!?]/);
      if (punto === -1) break;
      posicion += punto + 1;
      oraciones++;
    }
    
    if (posicion > 30) frase = extracto.substring(0, posicion).trim();
    else {
      frase = extracto.substring(0, 300);
      const espacio = frase.lastIndexOf(" ");
      if (espacio > 30) frase = frase.substring(0, espacio) + "…";
    }

    let imagenArtista = null;
    if (d2.thumbnail && d2.thumbnail.source) imagenArtista = d2.thumbnail.source;
    else if (d2.originalimage && d2.originalimage.source) imagenArtista = d2.originalimage.source;

    if (imagenArtista) imagenArtistaGlobal = imagenArtista;

    return { frase, imagenArtista, genero: null, fuente: "Wikipedia" };
  } catch(e) { log("err", "Wikipedia: " + e.message); return null; }
}

async function buscarEnAudioDB(artista) {
  if (!artista) return null;
  try {
    const nombre = encodeURIComponent(artista.trim());
    const res = await fetchConProxy(AUDIODB_URL + nombre);
    const datos = await res.json();
    if (!datos.artists || !datos.artists.length) return null;
    const art = datos.artists[0];
    const genero = art.strGenre || null;
    const biografia = (art.strBiographyES || "").trim();
    const imagenArtista = art.strArtistFanart || art.strArtistThumb || null;
    
    if (imagenArtista) imagenArtistaGlobal = imagenArtista;
    
    if (!biografia && genero) {
      return { frase: `${artista} — referente del género ${genero.toLowerCase()}.`, imagenArtista, genero, fuente: "TheAudioDB" };
    }
    
    if (biografia) {
      let frase = "", oraciones = 0, posicion = 0, maxCaracteres = 320;
      while (oraciones < 3 && posicion < biografia.length && posicion < maxCaracteres) {
        const punto = biografia.substring(posicion).search(/[.!?]/);
        if (punto === -1) break;
        posicion += punto + 1;
        oraciones++;
      }
      if (posicion > 30) frase = biografia.substring(0, posicion).trim();
      return { frase, imagenArtista, genero, fuente: "TheAudioDB" };
    }
  } catch(e) { log("err", "AudioDB: " + e.message); }
  return null;
}

}

function guardarCache(clave, datos) {
  SMART_CACHE[clave] = { ...datos, _timestamp: Date.now() };
  try { localStorage.setItem("sikodark-smart-cache", JSON.stringify(SMART_CACHE)); } catch(e) {}
}
function obtenerCache(clave) {
  const item = SMART_CACHE[clave];
  if (!item) return null;
  if (Date.now() - item._timestamp > CACHE_EXPIRY) { delete SMART_CACHE[clave]; return null; }
  return item;
}

function cambiarFondo(urlImagen) {
  if (!urlImagen) return;
  try {
    for (let hoja of document.styleSheets) {
      for (let regla of hoja.cssRules) {
        if (regla.selectorText === "body::before") {
          regla.style.backgroundImage = `url('${urlImagen}')`;
          return;
        }
      }
    }
  } catch(e) {}
}

async function procesarCancionInteligente(track) {
  if (!track || !track.artist || !track.title) {
    log("warn", "Notificación: falta artista o título");
    return;
  }
  
  const trackId = `${track.artist.toLowerCase().trim()}||${track.title.toLowerCase().trim()}`;
  if (trackId === lastSmartTrack) {
    log("info", "Notificación: misma canción, saltando");
    return;
  }
  lastSmartTrack = trackId;
  
  const cacheClave = track.artist.toLowerCase().trim();
  const cacheado = obtenerCache(cacheClave);
  let infoArtista;
  
  if (cacheado) {
    log("info", `Notificación: caché para "${track.artist}"`);
    infoArtista = cacheado;
    if (infoArtista.imagenArtista) imagenArtistaGlobal = infoArtista.imagenArtista;
  } else {
    log("info", `Notificación: buscando info de "${track.artist}"...`);
    infoArtista = await buscarInfoArtistaCompleta(track.artist);
    if (infoArtista) {
      guardarCache(cacheClave, infoArtista);
      log("ok", `Notificación: info encontrada en ${infoArtista.fuente}`);
    } else {
      log("warn", "Notificación: sin info, usando frase de respaldo");
      infoArtista = { frase: FRASES_RESPALDO[Math.floor(Math.random() * FRASES_RESPALDO.length)] };
      guardarCache(cacheClave, infoArtista);
    }
  }
  
  const infoFinal = {
    frase: infoArtista.frase,
    caratula: cover || infoArtista.imagenArtista || LOGO,
    genero: infoArtista.genero || null,
    fuente: infoArtista.fuente || null
  };
  
  if (infoFinal.caratula && infoFinal.caratula !== LOGO) cambiarFondo(infoFinal.caratula);
  mostrarNotificacionInteligente(infoFinal);
}
