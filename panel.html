<!DOCTYPE html>
<html lang="es">
<head><link rel="manifest" href="panel-manifest.json">
<meta name="theme-color" content="#171820">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel DJ — sikodark radio</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#171820;--card:#22232b;--sec:#2c2d35;--text:#f5f5f7;--muted:#a5a6ad;--pri:#ff8a24;--bor:rgba(255,255,255,.1);--ok:#34c759;--err:#ff3b30}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 8px}
.sup{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.estado{font-size:12px;color:var(--muted);flex:1;min-width:150px}
button{background:var(--pri);color:#191919;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer}
.mini{padding:6px 12px;margin:0;font-size:12px;background:var(--sec);color:var(--text)}
.mini.peligro{background:rgba(255,59,48,.15);color:var(--err)}
.mini.ok{background:rgba(52,199,89,.15);color:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bor);border-radius:14px;padding:14px;text-align:center}
.card .n{font-size:24px;font-weight:800;color:var(--pri)}
.card .n.vivo{color:var(--ok)}
.card .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
h2{font-size:15px;margin:20px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--bor)}
th,td{padding:9px 10px;text-align:left;font-size:13px;border-bottom:1px solid var(--bor)}
th{background:var(--sec);font-size:11px;text-transform:uppercase;color:var(--muted)}
td.num{font-weight:800;color:var(--pri)}
.pos{color:var(--muted);font-family:monospace;font-size:12px}
.nombreUser{font-weight:700}
.ico{font-size:16px}
.punto{display:inline-block;width:13px;height:13px;border-radius:50%;background:#e8e8e8}
.punto.vivo{background:var(--ok);box-shadow:0 0 9px rgba(52,199,89,.8);animation:pulso 1.4s infinite}
@keyframes pulso{50%{opacity:.45}}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--sec);color:var(--muted);font-size:11px;margin:2px}
.chips{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--sec);color:var(--muted);border-radius:999px;padding:2px 8px;font-size:10.5px}
.vacio{color:var(--muted);font-size:13px;padding:12px;background:var(--card);border:1px dashed var(--bor);border-radius:12px}
.bloqueadoTxt{color:var(--err);font-size:11px}
.sub2{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px}
</style>
</head>
<body>
<h1>🎛️ Panel DJ — sikodark radio</h1>
<div class="sup">
  <span class="estado" id="estado">Conectando…</span>
  <button class="mini" onclick="location.reload()">🔄 Actualizar</button>
</div>

<div class="cards">
  <div class="card"><div class="n" id="cOyentes">—</div><div class="l">Oyentes únicos</div></div>
  <div class="card"><div class="n vivo" id="cVivos">—</div><div class="l">🟢 En vivo ahora</div></div>
  <div class="card"><div class="n" id="cLikes">—</div><div class="l">Me gusta ❤️</div></div>
</div>

<h2>👥 Oyentes registrados</h2>
<div id="tUsuarios"></div>

<h2>🏆 Artistas más queridos (me gusta)</h2>
<div id="tArtistas"></div>

<h2>❤️ Últimos me gusta</h2>
<div id="tUltimos"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9Q9N1TTqWRUpeh2lo7tGuG8lwTrvbHrA",
  authDomain: "sikodarkradio-26a07.firebaseapp.com",
  projectId: "sikodarkradio-26a07",
  storageBucket: "sikodarkradio-26a07.firebasestorage.app",
  messagingSenderId: "941041207378",
  appId: "1:941041207378:web:994e34372109d30acf778b"
};

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;"}[c]))}
function haceCuanto(f){
  try{
    const ms = Date.now() - new Date(f).getTime();
    if (isNaN(ms) || ms < 0) return "?";
    if (ms < 120000) return "ahora";
    if (ms < 3600000) return "hace " + Math.floor(ms/60000) + " min";
    if (ms < 86400000) return "hace " + Math.floor(ms/3600000) + " h";
    return "hace " + Math.floor(ms/86400000) + " días";
  }catch(e){ return "?"; }
}

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== 🗄️ DATOS EN MEMORIA (se actualizan solos con onSnapshot) ===== */
const usuarios = {}, presencia = {}, ultimaVisita = {};
let megustas = [];

const VENTANA_VIVO = 90000; // verde si la señal tiene menos de 1.5 min
const fresco = p => p && p.escuchando !== false && Date.now() - (p.ultimaSenal || 0) < VENTANA_VIVO;

function dispositivoDe(uid){
  const p = presencia[uid];
  if (p && p.dispositivo) return p.dispositivo;
  const v = ultimaVisita[uid];
  return (v && v.dispositivo) || "?";
}
const icono = d => d === "celular" ? "📱" : d === "PC" ? "💻" : d === "TV" ? "📺" : "❔";
const ORDEN = { celular: 0, PC: 1, TV: 2 };

function nombreDe(uid){
  return (usuarios[uid] && usuarios[uid].nombre) ||
         (presencia[uid] && presencia[uid].nombre) || "Anónimo";
}

/* ===== 🔴 ESCUCHA EN VIVO ===== */
db.collection("usuarios").onSnapshot(s => { s.forEach(d => usuarios[d.id] = d.data()); render(); });
db.collection("presencia").onSnapshot(s => { s.forEach(d => presencia[d.id] = d.data()); render(); });
db.collection("megustas").onSnapshot(s => { megustas = s.docs.map(d => d.data()); render(); });
db.collection("visitas").onSnapshot(s => {
  s.forEach(d => {
    const v = d.data(); if (!v.uid) return;
    const prev = ultimaVisita[v.uid];
    if (!prev || String(v.fecha || "") > String(prev.fecha || "")) ultimaVisita[v.uid] = v;
  });
  render();
});

/* Refuerzo: apaga el 🟢 cuando la señal envejece */
setInterval(render, 15000);

/* ===== 🎨 RENDER ===== */
function render(){
  document.getElementById("estado").textContent =
    "✅ Datos actualizados: " + new Date().toLocaleTimeString() + " · en vivo";

  /* --- Tarjetas --- */
  const uids = Object.keys(usuarios);
  let vivos = 0;
  uids.forEach(u => { if (fresco(presencia[u])) vivos++; });
  document.getElementById("cOyentes").textContent = uids.length;
  document.getElementById("cVivos").textContent = vivos;
  document.getElementById("cLikes").textContent = megustas.length;

  /* --- 👥 Oyentes: vivos primero, agrupados por dispositivo --- */
  const ordenados = uids.slice().sort((a,b) => {
    const va = fresco(presencia[a]) ? 0 : 1, vb = fresco(presencia[b]) ? 0 : 1;
    if (va !== vb) return va - vb;
    const da = ORDEN[dispositivoDe(a)] ?? 9, dbo = ORDEN[dispositivoDe(b)] ?? 9;
    if (da !== dbo) return da - dbo;
    return nombreDe(a).localeCompare(nombreDe(b));
  });

  document.getElementById("tUsuarios").innerHTML = ordenados.length
    ? '<table><tr><th>Estado</th><th></th><th>Oyente</th><th>Conexión</th><th>Control</th></tr>' +
      ordenados.map(uid => {
        const u = usuarios[uid] || {};
        const vivo = fresco(presencia[uid]);
        const disp = dispositivoDe(uid);
        const senal = presencia[uid] && presencia[uid].ultimaSenal;
        const ref = senal || u.ultimaConexion || u.fechaRegistro || "";
        return '<tr>' +
          '<td><span class="punto' + (vivo ? ' vivo' : '') + '"></span></td>' +
          '<td class="ico" title="' + esc(disp) + '">' + icono(disp) + '</td>' +
          '<td><span class="nombreUser">' + esc(nombreDe(uid)) + '</span>' +
            (u.bloqueado ? ' <span class="bloqueadoTxt">🚫 bloqueado</span>' : '') + '</td>' +
          '<td class="pos">' + (senal ? haceCuanto(new Date(senal).toISOString()) : haceCuanto(ref)) + '</td>' +
          '<td>' +
            '<button class="mini ' + (u.bloqueado ? "ok" : "peligro") + '" onclick="bloquearUsuario(\'' + uid + '\', ' + !!u.bloqueado + ')">' + (u.bloqueado ? "✅" : "🚫") + '</button>' +
            '<button class="mini" onclick="renombrarUsuario(\'' + uid + '\')">✏️</button>' +
          '</td></tr>';
      }).join("") + '</table>'
    : '<div class="vacio">Aún no hay oyentes registrados (aparecen cuando ponen su nombre).</div>';

  /* --- 🏆 Artistas + quiénes dieron like --- */
  const porArtista = {};
  megustas.forEach(m => {
    const a = m.artista || "Desconocido";
    if (!porArtista[a]) porArtista[a] = { n: 0, uids: new Set() };
    porArtista[a].n++;
    if (m.uid) porArtista[a].uids.add(m.uid);
  });
  const rankArt = Object.entries(porArtista).sort((a,b) => b[1].n - a[1].n);
  document.getElementById("tArtistas").innerHTML = rankArt.length
    ? '<table><tr><th>#</th><th>Artista</th><th>❤️</th></tr>' + rankArt.map((r,i) => {
        const chips = [...r[1].uids].map(u => '<span class="chip">' + esc(nombreDe(u)) + '</span>').join("");
        return '<tr><td class="pos">#' + (i+1) + '</td>' +
          '<td>' + esc(r[0]) + (chips ? '<div class="chips">' + chips + '</div>' : '') + '</td>' +
          '<td class="num">' + r[1].n + '</td></tr>';
      }).join("") + '</table>'
    : '<div class="vacio">Todavía no hay me gusta.</div>';

  /* --- ❤️ Últimos me gusta (con quién) --- */
  const ult = megustas.slice().sort((a,b) => String(b.fecha).localeCompare(String(a.fecha))).slice(0,10);
  document.getElementById("tUltimos").innerHTML = ult.length
    ? '<table><tr><th>Tema</th><th>Oyente</th><th>Fecha</th></tr>' + ult.map(x => {
        let f = "?"; try{ f = new Date(x.fecha).toLocaleString(); }catch(e){}
        return '<tr><td>❤️ ' + esc(x.artista) + ' — ' + esc(x.tema) + '</td>' +
          '<td>' + esc(nombreDe(x.uid)) + '</td><td class="pos">' + f + '</td></tr>';
      }).join("") + '</table>'
    : '<div class="vacio">Todavía no hay me gusta.</div>';
}

/* ===== 🛠️ CONTROLES ===== */
window.bloquearUsuario = async function(id, estaBloqueado){
  try{
    if (estaBloqueado){
      await db.collection("usuarios").doc(id).set({ bloqueado: false }, { merge:true });
      return;
    }
    if (confirm("¿Bloquear a este oyente? No podrá usar la radio.")){
      await db.collection("usuarios").doc(id).set({ bloqueado: true }, { merge:true });
    }
  }catch(e){ alert("Error: " + e.message); }
};

window.renombrarUsuario = async function(id){
  const actual = nombreDe(id);
  const nuevo = prompt("Nombre del oyente:", actual);
  if (nuevo && nuevo.trim().length >= 2){
    await db.collection("usuarios").doc(id).set({ nombre: nuevo.trim().slice(0,20) }, { merge:true });
  }
};

firebase.auth().signInAnonymously()
  .catch(e => { document.getElementById("estado").textContent = "❌ Error: " + e.message; });
</script>

<!-- ===== ⇩ INSTALAR PANEL COMO APP ===== -->
<button id="btnInstalarPanel" style="display:none;position:fixed;bottom:18px;right:18px;z-index:100000;background:var(--pri);color:#191919;border:0;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:0 8px 25px rgba(0,0,0,.4)">⇩ Instalar panel</button>
<script>
(function(){
  let dpPanel = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    dpPanel = e;
    var b = document.getElementById("btnInstalarPanel");
    if (b) b.style.display = "block";
  });
  var b = document.getElementById("btnInstalarPanel");
  if (b) b.onclick = function(){
    if (dpPanel){ dpPanel.prompt(); b.style.display = "none"; }
  };
})();
</script>
</body>
</html>
