<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget · Cola de pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c;
    --panel:#1b1b1e;
    --card:#202024;
    --card2:#26262a;
    --borde:rgba(232,161,58,.55);
    --borde-suave:rgba(255,255,255,.08);
    --texto:#f2f2f2;
    --gris:#9a9aa0;
    --ambar:#e8a13a;
    --verde:#2fbf5f;
    --rojo:#e03b3b;
    --mono:'Space Mono',monospace;
    --sans:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--texto);
    font-family:var(--sans);
    display:flex;justify-content:center;
    padding:14px;
  }
  .widget{
    width:100%;max-width:430px;
    background:var(--panel);
    border-radius:26px;
    display:flex;flex-direction:column;
    overflow:hidden;
    min-height:620px;
    max-height:100vh;
  }
  /* ---------- cabecera ---------- */
  .head{padding:24px 22px 0}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
  .total{
    flex:none;font-family:var(--mono);font-size:12.5px;
    background:var(--card2);border-radius:999px;padding:8px 14px;color:var(--texto);
    white-space:nowrap;margin-top:6px;
  }
  .sub{font-size:17px;font-weight:600;color:var(--texto);margin-top:14px}
  /* ---------- pestañas ---------- */
  .tabs{display:flex;gap:10px;margin:16px 0 14px}
  .tab{
    flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
    font-weight:700;font-size:12.5px;letter-spacing:.08em;
    padding:12px 8px;border-radius:16px;cursor:pointer;
    background:transparent;border:2px solid transparent;color:var(--gris);
    transition:background .2s,color .2s,border-color .2s;
  }
  .tab .n{
    font-family:var(--mono);font-size:11px;min-width:22px;height:22px;
    display:grid;place-items:center;border-radius:999px;
    background:#3a3a3e;color:#d6d6d6;
  }
  .tab:hover{color:var(--texto)}
  .tab.activa{border-color:var(--ambar);color:var(--ambar)}
  .tab.activa .n{background:var(--ambar);color:#141414;font-weight:700}
  /* ---------- lista ---------- */
  .lista{flex:1;overflow-y:auto;padding:0 14px 10px;scroll-behavior:smooth}
  .lista::-webkit-scrollbar{width:4px}
  .lista::-webkit-scrollbar-thumb{background:#3a3a3e;border-radius:4px}
  .card{
    display:flex;align-items:center;gap:12px;
    background:var(--card);
    border:1.5px solid var(--borde);
    border-radius:18px;padding:10px;margin-bottom:12px;
  }
  .arte{
    flex:none;width:54px;height:54px;border-radius:12px;overflow:hidden;
    display:grid;place-items:center;
    font-family:var(--mono);font-weight:700;font-size:15px;color:rgba(255,255,255,.85);
    letter-spacing:.04em;
  }
  .arte img{width:100%;height:100%;object-fit:cover;display:block}
  .card-txt{flex:1;min-width:0}
  .card-txt b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-txt span{display:block;font-size:12.5px;color:var(--gris);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .estado{
    flex:none;display:inline-flex;align-items:center;gap:7px;
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
    border-radius:999px;padding:7px 11px;
  }
  .estado .ico{width:16px;height:16px;border-radius:999px;display:grid;place-items:center;flex:none}
  .estado.sono{border:1.5px solid var(--verde);color:var(--verde);background:rgba(47,191,95,.08)}
  .estado.sono .ico{background:var(--verde)}
  .estado.no_estaba{border:1.5px solid var(--rojo);color:var(--rojo);background:rgba(224,59,59,.08)}
  .estado.no_estaba .ico{background:transparent}
  .estado.pendiente{border:1.5px solid var(--ambar);color:var(--ambar);background:rgba(232,161,58,.08)}
  .estado.pendiente .ico{background:var(--ambar)}
  .vacio{padding:34px 14px;text-align:center;color:var(--gris);font-size:13.5px}
  .vacio b{display:block;font-size:15px;color:var(--texto);margin-bottom:4px}
  /* ---------- pie ---------- */
  .pie{
    flex:none;display:flex;align-items:center;gap:10px;
    padding:12px 14px 16px;border-top:1px solid var(--borde-suave);
  }
  .btn-pedir{
    flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
    background:#141416;border:1.5px solid var(--borde);color:var(--ambar);
    font-weight:700;font-size:13.5px;letter-spacing:.06em;
    border-radius:999px;padding:14px 10px;cursor:pointer;
    transition:background .2s;
  }
  .btn-pedir:hover{background:#232326}
  .btn-pedir svg{width:15px;height:15px;flex:none}
  .directo{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--texto);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:999px;background:var(--ambar);animation:pulso 1.4s ease infinite}
  @keyframes pulso{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .fab{
    flex:none;width:48px;height:48px;border-radius:999px;
    background:var(--ambar);color:#141414;display:grid;place-items:center;
    cursor:pointer;border:0;
  }
  .fab svg{width:18px;height:18px}
  .fab:active{transform:scale(.94)}
  /* ---------- modal ---------- */
  .velo{
    position:absolute;inset:0;background:rgba(0,0,0,.62);
    display:none;align-items:flex-end;justify-content:center;z-index:20;
  }
  .velo.abierto{display:flex}
  .modal{
    width:100%;background:var(--panel);border-top:1.5px solid var(--borde);
    border-radius:24px 24px 0 0;padding:22px;animation:sube .25s ease;
  }
  @keyframes sube{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .modal h2{font-size:19px;font-weight:700}
  .modal p{font-size:12.5px;color:var(--gris);margin-top:4px}
  .campo{margin-top:14px}
  .campo label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ambar);margin-bottom:7px}
  .campo input{
    width:100%;background:var(--card2);border:1.5px solid var(--borde-suave);
    border-radius:12px;padding:12px 14px;color:var(--texto);
    font-family:var(--sans);font-size:14px;outline:none;
  }
  .campo input:focus{border-color:var(--ambar)}
  .modal-acciones{display:flex;gap:10px;margin-top:18px}
  .btn-x{
    flex:1;background:transparent;border:1.5px solid var(--borde-suave);color:var(--gris);
    font-weight:600;font-size:13.5px;border-radius:999px;padding:13px;cursor:pointer;
  }
  .btn-ok{
    flex:1.4;background:var(--ambar);border:0;color:#141414;
    font-weight:700;font-size:13.5px;border-radius:999px;padding:13px;cursor:pointer;
  }
  .btn-ok:disabled{opacity:.5}
  /* ---------- aviso ---------- */
  .toast{
    position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);
    background:var(--verde);color:#08120b;font-weight:700;font-size:13px;
    border-radius:999px;padding:11px 18px;opacity:0;pointer-events:none;
    transition:opacity .3s,transform .3s;white-space:nowrap;z-index:30;
  }
  .toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}
  .widget{position:relative}
  @media (max-width:360px){
    .head{padding:18px 16px 0}
    h1{font-size:24px}
    .estado{padding:6px 8px}
  }
</style>
</head>
<body>

<div class="widget" id="widget">
  <div class="head">
    <div class="head-row">
      <h1 id="titulo">Cola de<br>pedidos</h1>
      <div class="total" id="total">0 pedidos</div>
    </div>
    <div class="sub" id="subtitulo">Pedidos de los oyentes</div>
    <div class="tabs">
      <button class="tab" id="tabPend">PENDIENTES <span class="n" id="nPend">0</span></button>
      <button class="tab activa" id="tabSon">YA SONARON <span class="n" id="nSon">0</span></button>
    </div>
  </div>
  <div class="lista" id="lista"></div>
  <div class="pie">
    <button class="btn-pedir" id="btnPedir">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2zM19 15l.9 2.6L22.5 18l-2.6.9L19 21.5l-.9-2.6-2.6-.9 2.6-.4L19 15zM5 16l.7 2.1L8 19l-2.3.7L5 22l-.7-2.3L2 19l2.3-.9L5 16z"/></svg>
      PROGRAMÁ TU TEMA
    </button>
    <div class="directo"><span class="dot"></span>en directo</div>
    <button class="fab" id="fabTop" aria-label="Ir arriba">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 15l7-7 7 7"/></svg>
    </button>
  </div>

  <!-- modal de pedido -->
  <div class="velo" id="velo">
    <div class="modal">
      <h2>Programá tu tema</h2>
      <p>Dejanos tu nombre y lo que querés escuchar. Queda en la cola de pendientes.</p>
      <div class="campo">
        <label>TU NOMBRE</label>
        <input type="text" id="inNombre" maxlength="40" placeholder="Ej: Martín">
      </div>
      <div class="campo">
        <label>TU TEMA / ARTISTA</label>
        <input type="text" id="inTema" maxlength="60" placeholder="Ej: More Than a Feeling — Boston">
      </div>
      <div class="modal-acciones">
        <button class="btn-x" id="btnCerrar">Cerrar</button>
        <button class="btn-ok" id="btnEnviar">Enviar pedido</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">¡Anotado! Tu tema quedó en la cola</div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN — editá solo esto
   ============================================================ */
const CONFIG = {
  // Títulos visibles
  titulo: 'Cola de<br>pedidos',
  subtitulo: 'Pedidos de los oyentes',

  // (Opcional) URL de un JSON con la cola real. Si lo dejás vacío,
  // se usa DATOS de acá abajo. Estructura esperada:
  // [ { "tema":"The Strokes", "oyente":"pedido de los oyentes",
  //     "estado":"sono" | "no_estaba" | "pendiente",
  //     "arte":"https://.../portada.jpg" (opcional) } ]
  src: '',

  // Cada cuántos segundos vuelve a consultar src (0 = nunca)
  refreshSeg: 60,

  // Cola de ejemplo (los 5 pedidos visibles en tu captura).
  // Pegá acá tus 20 pedidos, o apuntá CONFIG.src a tu JSON.
  datos: [
    { tema:'The Strokes',   oyente:'pedido de los oyentes', estado:'sono' },
    { tema:'Damn Yankees',  oyente:'pedido de los oyentes', estado:'no_estaba' },
    { tema:'Danger Danger', oyente:'pedido de los oyentes', estado:'no_estaba' },
    { tema:'Bang Bang',     oyente:'Danger Danger',         estado:'no_estaba' },
    { tema:'Bon Jovi',      oyente:'pedido de los oyentes', estado:'sono' }
  ]
};

/* ============================================================
   MOTOR DEL WIDGET — no hace falta tocar de acá para abajo
   ============================================================ */
let items = normalizar(CONFIG.datos);
let tab = 'sonaron'; // 'pendientes' | 'sonaron'

function normalizar(lista){
  return (lista||[]).filter(Boolean).map(x=>{
    const e = String(x.estado||'pendiente').toLowerCase()
      .replace(/ó/g,'o').replace(/\s+/g,'_');
    return {
      tema: x.tema || x.titulo || 'Sin título',
      oyente: x.oyente || x.pedido || '',
      estado: ['sono','sonado','ya_sonaron'].includes(e) ? 'sono'
            : ['no_estaba','no_esta'].includes(e) ? 'no_estaba'
            : 'pendiente',
      arte: x.arte || null
    };
  });
}

/* ---- portadas de reserva: tile con iniciales, color por hash ---- */
function hueDe(txt){let h=0;for(const c of txt)h=(h*31+c.charCodeAt(0))%360;return h;}
function arteDe(item){
  if(item.arte) return `<img src="${item.arte}" alt="" onerror="this.remove()">`;
  const iniciales = item.tema.split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase();
  const h = hueDe(item.tema);
  return `<div style="width:100%;height:100%;display:grid;place-items:center;background:hsl(${h},38%,20%)">${iniciales||'♪'}</div>`;
}

const ICO = {
  check:'<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>',
  cruz:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--rojo)" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  reloj:'<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"><path d="M12 7v5l3.5 2"/><circle cx="12" cy="12" r="9" stroke-width="2.6"/></svg>'
};
const TEXTO_ESTADO = { sono:'SONÓ', no_estaba:'NO ESTABA', pendiente:'PENDIENTE' };

/* ---- render ---- */
const lista = document.getElementById('lista');
function render(){
  document.getElementById('titulo').innerHTML = CONFIG.titulo;
  document.getElementById('subtitulo').textContent = CONFIG.subtitulo;
  document.getElementById('total').textContent = `${items.length} pedidos`;

  const pend = items.filter(x=>x.estado==='pendiente');
  const son  = items.filter(x=>x.estado!=='pendiente');
  document.getElementById('nPend').textContent = pend.length;
  document.getElementById('nSon').textContent  = son.length;
  document.getElementById('tabPend').classList.toggle('activa', tab==='pendientes');
  document.getElementById('tabSon').classList.toggle('activa', tab==='sonaron');

  const ver = tab==='pendientes' ? pend : son;
  lista.innerHTML = ver.length ? ver.map(x=>`
    <div class="card">
      <div class="arte">${arteDe(x)}</div>
      <div class="card-txt">
        <b>${escapeHtml(x.tema)}</b>
        <span>${escapeHtml(x.oyente)}</span>
      </div>
      <span class="estado ${x.estado}">
        <span class="ico">${x.estado==='sono'?ICO.check:x.estado==='no_estaba'?ICO.cruz:ICO.reloj}</span>
        ${TEXTO_ESTADO[x.estado]}
      </span>
    </div>`).join('')
    : `<div class="vacio"><b>${tab==='pendientes'?'Nada pendiente por ahora':'Todavía no sonó nada'}</b>Los pedidos van apareciendo acá en directo.</div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---- pestañas ---- */
document.getElementById('tabPend').onclick=()=>{tab='pendientes';render();};
document.getElementById('tabSon').onclick=()=>{tab='sonaron';render();};

/* ---- volver arriba ---- */
document.getElementById('fabTop').onclick=()=>lista.scrollTo({top:0,behavior:'smooth'});

/* ---- modal de pedido ---- */
const velo=document.getElementById('velo'),
      inNombre=document.getElementById('inNombre'),
      inTema=document.getElementById('inTema'),
      btnEnviar=document.getElementById('btnEnviar');
document.getElementById('btnPedir').onclick=()=>{
  velo.classList.add('abierto');
  setTimeout(()=>inTema.focus(),150);
};
document.getElementById('btnCerrar').onclick=()=>velo.classList.remove('abierto');
velo.onclick=e=>{if(e.target===velo)velo.classList.remove('abierto');};
btnEnviar.onclick=()=>{
  const tema=inTema.value.trim();
  if(!tema){inTema.focus();inTema.style.borderColor='var(--rojo)';setTimeout(()=>inTema.style.borderColor='',1200);return;}
  items.unshift({tema, oyente:inNombre.value.trim()||'pedido de un oyente', estado:'pendiente', arte:null});
  tab='pendientes'; render();
  inTema.value=''; inNombre.value='';
  velo.classList.remove('abierto');
  const t=document.getElementById('toast');
  t.classList.add('ver'); setTimeout(()=>t.classList.remove('ver'),2600);
  lista.scrollTo({top:0,behavior:'smooth'});
};

/* ---- datos en vivo (opcional, vía CONFIG.src) ---- */
async function cargar(){
  if(!CONFIG.src) return;
  try{
    const r=await fetch(CONFIG.src,{cache:'no-store'});
    const d=await r.json();
    items=normalizar(Array.isArray(d)?d:d.pedidos);
    render();
  }catch(e){ /* silencioso: la cola anterior sigue visible */ }
}
if(CONFIG.src && CONFIG.refreshSeg>0){
  setInterval(cargar, CONFIG.refreshSeg*1000);
  cargar();
}

render();
</script>
</body>
</html>
